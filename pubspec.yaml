name: bachaoo

description: "A new Flutter project."

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^13.1.0
  flutter_staggered_grid_view: ^0.7.0
  font_awesome_flutter: ^11.0.0
  get: ^4.7.3
  google_fonts: ^8.2.1
  intl: ^0.20.3
  intl_phone_field: ^3.2.0
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/ic_bachao.png"
    background_color: "#006B2E"
    theme_color: "#006B2E"
  image_path: "assets/icons/ic_bachao.png"